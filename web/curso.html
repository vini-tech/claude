<style>

:root {

}

    --acento: #86ade6; --acento-suave: #1d2b3e; --sobre-acento: #0f141a; --erro: #f07b6b; --aviso: #e3b05a; --info: #ab9df2; --ok: #6cc28f;
    --erro-fundo: #3a1f1c; --aviso-fundo: #372a14; --info-fundo: #262040; --ok-fundo: #1a3325;
    --tecla-branca: #d9dfe6; --tecla-preta: #0b0f14; --tecla-borda: #3a4553; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0f141a; --folha: #161d25; --tinta: #e4e9ef; --apagado: #93a0ae; --pauta: #4a5664; --linha: #2a3440;
  --acento: #86ade6; --acento-suave: #1d2b3e; --sobre-acento: #0f141a; --erro: #f07b6b; --aviso: #e3b05a; --info: #ab9df2; --ok: #6cc28f;

* { box-sizing: border-box; }

/* ---------------------------------------------------------------- partitura e oficina (compartilhado com oficina.js) */
/* ---------------------------------------------------------------- partitura e oficina (compartilhado com oficina.js) */
.pauta-linha { stroke: var(--pauta); stroke-width: 1; }
.barra { stroke: var(--apagado); stroke-width: 1; }

.tinta { fill: var(--tinta); }

.sev-erro { --sev: var(--erro); } .sev-aviso { --sev: var(--aviso); } .sev-info { --sev: var(--info); } .sev-ok { --sev: var(--ok); } .sev-foco { --sev: var(--acento); }
.marcada .tinta { fill: var(--sev); } .marcada .contorno { stroke: var(--sev); } .marcada .haste { stroke: var(--sev); }

.t-erro { color: var(--erro); } .t-aviso { color: var(--aviso); }

.barra-nivel { height: 5px; background: var(--linha); border-radius: 3px; overflow: hidden; } .barra-nivel i { display: block; height: 100%; background: var(--ok); }
.tema-link .cap { display: inline-block; min-width: 1.8em; color: var(--apagado); font-variant-numeric: tabular-nums; }

.sumario { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: 0; z-index: 3; background: var(--papel); padding: 8px 0; border-bottom: 1px solid var(--linha); }

<script>
"use strict";
const M = window.Motor, P = window.Partitura, Som = window.Som, G = window.Geradores, Of = window.Oficina, Cn = window.Cantus, Est = window.Estilo, Bu = window.Buscador, Qs = window.Questoes, Tr = window.Transpor, T = M.T;
const { niveis } = window.TEMAS;
const $ = (id) => document.getElementById(id);
const esc = Of.esc, bonito = Of.bonito;
const bonitoTexto = (s) => String(s).replace(/\b([A-G])(#|b)(\d)\b/g, (m, l, a, o) => l + (a === "#" ? "♯" : "♭") + o);

// ---------------------------------------------------------------- progresso e anotações (localStorage)
const CHAVE = "drl-atelie:v1";
const novo = () => ({ v: 1, notas: {}, exercicios: {}, antes: {}, erros: {}, dias: {} });
let est = novo();
try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s && s.v === 1) est = { ...novo(), ...s }; } catch (e) {}
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(est)); } catch (e) {} };
const nota = (k) => est.notas[k] || "";
const guardarNota = (k, v) => { est.notas[k] = v; salvar(); };

let temasEmOrdem = [];
const ordenarTemas = () => { temasEmOrdem = niveis.flatMap((n) => n.temas.map((t) => ({ ...t, nivel: n }))); };
const temaPorId = (id) => temasEmOrdem.find((t) => t.id === id);
const exFeito = (id) => est.exercicios[id] && est.exercicios[id].aprovado;

function folha(html) { $("folha-dentro").innerHTML = html; $("folha").hidden = false; }
function fecharFolha() { $("folha").hidden = true; }
let tBrinde = null;
function brinde(msg) { const b = $("brinde"); b.textContent = msg; b.hidden = false; clearTimeout(tBrinde); tBrinde = setTimeout(() => (b.hidden = true), 2400); }

// ---------------------------------------------------------------- navegação (#tema-id)
function rota() {
  const id = location.hash.replace(/^#/, "");
  const t = temaPorId(id);
  if (t) desenharTema(t); else desenharInicio();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", rota);

// ---------------------------------------------------------------- início
function desenharInicio() {
  let h = `<header class="topo">
    <div class="rotulo">Ateliê de composição</div>
    <h1>Da regra à <em>liberdade</em></h1>
    <p class="lead">Um livro de composição em capítulos: em cada um, a regra como os tratados a ensinavam, um exemplo comentado decisão por decisão, como os compositores a quebraram — e exercícios corrigidos na hora, do completar ao livre.</p>
  </header>` + treinoDeHojeHTML();
  // níveis recolhíveis (o livro é longo); abre o nível em que você está
  let cap = 0;
  const atual = niveis.find((n) => n.temas.some((t) => t.exercicios.some((e) => !exFeito(e.id)))) || niveis[0];
  let aberto = {};
  try { aberto = JSON.parse(localStorage.getItem("drl-atelie:niveis") || "{}"); } catch (e) {}
  for (const n of niveis) {
    if (!n.temas.length) continue;
    const total = n.temas.reduce((a, t) => a + t.exercicios.length, 0);
    const feitos = n.temas.reduce((a, t) => a + t.exercicios.filter((e) => exFeito(e.id)).length, 0);
    const abrir = aberto[n.numero] !== undefined ? aberto[n.numero] : n === atual;
    h += `<details class="nivel" data-n="${n.numero}" ${abrir ? "open" : ""}><summary><div class="rotulo">Nível ${n.numero} · ${n.temas.length} capítulos · ${feitos}/${total} exercícios</div><h2>${esc(n.titulo)}</h2>
      <div class="barra-nivel"><i style="width:${total ? Math.round((feitos / total) * 100) : 0}%"></i></div></summary><p class="lead">${esc(n.resumo)}</p><ol class="lista-temas">`;
    for (const t of n.temas) {
      cap++;
      const f = t.exercicios.filter((e) => exFeito(e.id)).length;
      h += `<li><a class="tema-link ${f === t.exercicios.length ? "completo" : ""}" href="#${t.id}"><span class="t"><span class="cap">${cap}</span>${esc(t.titulo)}</span><span class="d">${esc(t.objetivo)}</span>
        <span class="p">${f}/${t.exercicios.length} exercícios</span></a></li>`;
    }
    h += `</ol></details>`;
  }
  h += `<footer class="rodape"><details class="cartao"><summary>Guardar o progresso</summary>
      <p>Seu progresso e suas anotações ficam neste navegador. Copie o código para guardar ou levar para outro aparelho.</p>
      <textarea id="codigo" readonly aria-label="Código do progresso"></textarea>
      <div class="linha-botoes"><button class="botao" id="bt-copiar">Copiar</button><button class="botao" id="bt-colar">Usar um código</button></div></details>
    <p>Para escrever livremente nos 10 níveis, use a <a href="https://claude.ai/artifact/WhPHE6UFcSnxz6QiTVXYjB" target="_blank" rel="noopener">oficina</a>.</p></footer>`;
  $("pagina").innerHTML = h;
  for (const d of document.querySelectorAll("details.nivel")) d.addEventListener("toggle", () => {
    try { const a = JSON.parse(localStorage.getItem("drl-atelie:niveis") || "{}"); a[d.dataset.n] = d.open; localStorage.setItem("drl-atelie:niveis", JSON.stringify(a)); } catch (e) {}
  });
  for (const b of document.querySelectorAll("[data-sugestao]")) b.addEventListener("click", () => {
    const [tid, eid, modo] = b.dataset.sugestao.split("|");
    const t = temaPorId(tid), e = t.exercicios.find((x) => x.id === eid);
    if (modo === "sortear" && e.sortear) { const tx = textoSorteado(e); if (tx) return abrirExercicio(t, { ...e, solucao: null }, tx); }
    abrirExercicio(t, e);
  });
  $("codigo").value = btoa(unescape(encodeURIComponent(JSON.stringify(est))));
  $("bt-copiar").addEventListener("click", () => { const t = $("codigo"); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => brinde("Código copiado"), () => { t.select(); brinde("Selecione e copie"); }); });
  $("bt-colar").addEventListener("click", () => {
    folha(`<p><b>Cole o código</b></p><textarea id="codigo-novo" style="width:100%;min-height:90px" aria-label="Código"></textarea>
      <div class="linha-botoes"><button class="botao primario" id="usar">Usar</button><button class="botao" id="cancelar">Cancelar</button></div>`);
    $("usar").addEventListener("click", () => { try { const s = JSON.parse(decodeURIComponent(escape(atob($("codigo-novo").value.trim())))); if (s.v !== 1) throw 0; est = { ...novo(), ...s }; salvar(); fecharFolha(); rota(); brinde("Progresso carregado"); } catch (e) { brinde("Código inválido"); } });
    $("cancelar").addEventListener("click", fecharFolha);
  });
}

// ---------------------------------------------------------------- treino de hoje
// como na classe de harmonia de Paris (um exercício por dia) e nas cadências diárias de Boulanger:
// uma sessão curta que volta às regras que você mais quebra, um treino transposto e o próximo passo
function sequenciaDeDias() {
  const dias = est.dias || {};
  let n = 0;
  const d = new Date();
  if (!dias[diaDeHoje()]) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (!dias[k]) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}
function treinoDeHojeHTML() {
  const itens = [];
  const todos = temasEmOrdem.flatMap((t) => t.exercicios.map((e) => ({ t, e })));
  // 1. revisão dirigida: a regra mais quebrada nas últimas três semanas
  const limite = new Date(); limite.setDate(limite.getDate() - 21);
  const lim = `${limite.getFullYear()}-${String(limite.getMonth() + 1).padStart(2, "0")}-${String(limite.getDate()).padStart(2, "0")}`;
  const contagem = Object.entries(est.erros || {}).map(([r, ds]) => [r, ds.filter((d) => d >= lim).length]).filter(([r, n]) => n && M.REGRAS[r]).sort((a, b) => b[1] - a[1]);
  if (contagem.length) {
    const [regra, n] = contagem[0];
    const cands = todos.filter(({ e }) => (G.perfilDaPratica(e)[regra] === "erro") && (est.antes || {})[temasEmOrdem.find((x) => x.exercicios.includes(e)).id]);
    const esc1 = cands.find(({ e }) => e.sortear) || cands.find(({ e }) => !exFeito(e.id)) || cands[0];
    if (esc1) itens.push(`<li><b>Revisão dirigida</b><span>Você quebrou “${esc(M.REGRAS[regra].titulo)}” ${n}× nas últimas semanas. ${esc1.e.sortear ? "Um cantus novo" : "Um exercício"} para trabalhar isso: <i>${esc(esc1.e.titulo)}</i>.</span>
      <button class="botao" data-sugestao="${esc1.t.id}|${esc1.e.id}|sortear">Abrir</button></li>`);
  }
  // 2. o treino transposto do dia
  const tomEx = todos.find(({ e }) => e.tomDoDia);
  if (tomEx && (est.antes || {})[tomEx.t.id]) {
    const st = est.exercicios[tomEx.e.id] || {};
    const feito = st.diaFeito === diaDeHoje();
    itens.push(`<li><b>${feito ? "✓ " : ""}${esc(tomEx.e.titulo.replace("no tom do dia", ""))} em ${nomeTom(st.tom || Tr.tomDoDia(tomEx.e.tomDoDia))}</b><span>Transpor até ficar automático, como os napolitanos faziam com a regra da oitava.</span>
      <button class="botao" data-sugestao="${tomEx.t.id}|${tomEx.e.id}|">${feito ? "De novo" : "Abrir"}</button></li>`);
  }
  // 3. o próximo passo
  const prox = todos.find(({ e }) => !exFeito(e.id));
  if (prox) itens.push(`<li><b>Continuar</b><span>${esc(prox.t.titulo)} · <i>${esc(prox.e.titulo)}</i></span><button class="botao primario" data-sugestao="${prox.t.id}|${prox.e.id}|">Abrir</button></li>`);
  const seq = sequenciaDeDias();
  const semana = Object.entries(est.dias || {}).filter(([d]) => { const x = new Date(); x.setDate(x.getDate() - 7); return d > `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }).reduce((a, [, n]) => a + n, 0);
  return `<section class="cartao hoje"><div class="hoje-cab"><div><div class="rotulo">Treino de hoje</div><h2>Uma sessão curta, todo dia</h2></div>
    <div class="hoje-num"><b>${seq}</b><span>dia${seq === 1 ? "" : "s"} seguido${seq === 1 ? "" : "s"}</span><small>${semana} exercício${semana === 1 ? "" : "s"} na semana</small></div></div>
    <ul class="hoje-lista">${itens.join("")}</ul></section>`;
}

// ---------------------------------------------------------------- exemplos com partitura e som
function exemploHTML(ex, chave) {
  return `<figure class="exemplo" data-ex="${chave}"><div class="mini-partitura"></div>
    <figcaption>${ex.rotulo ? `<b>${esc(ex.rotulo)}</b> ` : ""}<button class="ouvir" type="button">▶ Ouvir</button>
    <label class="andamento"><span aria-hidden="true">♩ =</span><input type="range" min="40" max="176" step="4" value="${bpmExemplos()}" aria-label="Andamento dos exemplos"><span class="bpm">${bpmExemplos()}</span></label></figcaption></figure>`;
}

// andamento único para todos os exemplos (fica guardado no navegador)
const bpmExemplos = () => est.bpm || 88;
function mudarBpm(v) {
  est.bpm = v; salvar();
  for (const f of document.querySelectorAll("figure.exemplo")) { f.querySelector(".andamento input").value = v; f.querySelector(".bpm").textContent = v; }
}

const exemplosDaPagina = new Map();
function montarExemplos(raiz) {
  for (const fig of raiz.querySelectorAll("figure.exemplo")) {
    const ex = exemplosDaPagina.get(fig.dataset.ex);
    const caixa = fig.querySelector(".mini-partitura");
    let lido;
    try { lido = M.lerTexto(ex.partitura); } catch (e) { caixa.textContent = "(exemplo inválido: " + e.message + ")"; continue; }
    const desenhar = () => {
      const anotacoes = (ex.anotacoes || []).map(([v, i, t, sev]) => ({ nota: lido.vozes[v] && lido.vozes[v].notas[i], texto: t, sev })).filter((a) => a.nota);
      const cifras = (ex.cifras || []).map(([t, tx]) => ({ t: t * T, texto: tx }));
      const marcas = (ex.marcas || []).map(([v, i, sev]) => ({ notas: [lido.vozes[v].notas[i]], sev: sev || "erro" }));
      fig._layout = P.desenhar(caixa, lido, { compacta: true, largura: Math.max(260, Math.min(caixa.clientWidth || 600, 900) - 4), anotacoes, cifras, marcas, rotulos: ex.rotulos || lido.vozes.map((v) => (lido.vozes.length > 1 ? v.nome : "")) });
    };
    desenhar();
    fig._redesenhar = desenhar;
    const b = fig.querySelector(".ouvir");
    b.addEventListener("click", () => {
      if (Som.tocando()) { Som.parar(); return; }
      if (Som.tocar(lido, { bpm: bpmExemplos(), T, aoTick: (t) => P.moverCursor(fig._layout, t), aoFim: () => { P.moverCursor(fig._layout, null); b.textContent = "▶ Ouvir"; } })) b.textContent = "■ Parar";
    });
    const faixa = fig.querySelector(".andamento input");
    faixa.addEventListener("input", () => mudarBpm(+faixa.value));
    // tocando: recomeça no andamento novo quando o controle é solto
    faixa.addEventListener("change", () => { if (b.textContent.startsWith("■")) { Som.parar(); b.click(); } });
  }
}

// ---------------------------------------------------------------- página de tema
function campoAberto(chave, rotulo, dica = "") {
  return `<label class="campo"><span class="rotulo-campo">${rotulo}</span>
    <textarea data-nota="${chave}" rows="3" placeholder="${esc(dica)}">${esc(nota(chave))}</textarea></label>`;
}

function desenharTema(t) {
  exemplosDaPagina.clear();
  let n = 0;
  const reg = (ex) => { const k = `${t.id}-${n++}`; exemplosDaPagina.set(k, ex); return exemploHTML(ex, k); };
  const idx = temasEmOrdem.findIndex((x) => x.id === t.id);
  const ant = temasEmOrdem[idx - 1], prox = temasEmOrdem[idx + 1];
  let h = `<nav class="migalha"><a href="#">Ateliê</a> · Nível ${t.nivel.numero} · ${esc(t.nivel.titulo)}</nav>
    <header class="cab-tema"><h1>${esc(t.titulo)}</h1><p class="lead">${esc(t.objetivo)}</p>
    ${t.ouvir && t.ouvir.length ? `<div class="ouvir-lista"><span class="rotulo">Para ouvir e estudar</span><ul>${t.ouvir.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>` : ""}</header>`;
  if (t.esboco) h += `<section class="bloco esboco"><div class="rotulo">Antes da aula · esboço</div><p>${t.esboco}</p>${campoAberto(t.id + ":esboco", "Seu esboço ou sua primeira decisão", "Sem correção: escreva o que faria antes de ler.")}</section>`;
  // sumário do capítulo: cada seção com âncora
  const ROTULO = { texto: "", exemplo: "Exemplo", contraste: "Contraste", quebra: "Como quebrar" };
  const ancora = (k) => `${t.id}-s${k}`;
  h += `<nav class="sumario">${t.secoes.map((s, k) => `<a href="javascript:void 0" data-alvo="${ancora(k)}" class="${s.tipo}">${esc(s.titulo || ROTULO[s.tipo])}</a>`).join("")}<a href="javascript:void 0" data-alvo="${t.id}-ex" class="exs">Exercícios</a></nav>`;
  t.secoes.forEach((s, k) => {
    const id = `id="${ancora(k)}"`;
    if (s.tipo === "texto") h += `<section class="bloco texto" ${id}>${s.rotulo ? `<div class="rotulo">${esc(s.rotulo)}</div>` : ""}${s.titulo ? `<h2>${esc(s.titulo)}</h2>` : ""}${s.html}</section>`;
    else if (s.tipo === "quebra") {
      h += `<section class="bloco quebra" ${id}><div class="rotulo">Como quebrar</div>${s.titulo ? `<h2>${esc(s.titulo)}</h2>` : ""}${s.html || ""}
        ${(s.exemplos || []).map((x) => `<div class="quebra-ex">${reg(x)}${x.comentario ? `<p class="comentario-q">${x.comentario}</p>` : ""}</div>`).join("")}</section>`;
    } else if (s.tipo === "exemplo") {
      h += `<section class="bloco exemplo-camadas" ${id}><div class="rotulo">Exemplo resolvido</div><h2>${esc(s.titulo)}</h2>${s.intro ? `<p>${s.intro}</p>` : ""}`;
      s.camadas.forEach((c, k) => {
        h += `<div class="camada"><div class="camada-cab"><span class="num">${k + 1}</span><b>${esc(c.titulo)}</b></div>${c.texto ? `<p>${c.texto}</p>` : ""}
          ${c.partitura ? reg(c) : ""}
          ${(c.notas || []).map((x) => `<p class="nota-decisao ${x[0]}"><span class="tag">${{ decisao: "decisão", rejeitada: "alternativa descartada", checagem: "checagem" }[x[0]]}</span>${bonitoTexto(x[1])}</p>`).join("")}
          ${c.pausa ? `<div class="pausa"><p><b>Pausa:</b> ${c.pausa[0]}</p>${campoAberto(`${t.id}:pausa${k}`, "Sua resposta", "")}
            <button class="botao revelar" type="button">Ver o comentário</button><p class="comentario" hidden>${c.pausa[1]}</p></div>` : ""}</div>`;
      });
      h += `</section>`;
    } else if (s.tipo === "contraste") {
      h += `<section class="bloco contraste" ${id}><div class="rotulo">Contraste</div><h2>${esc(s.titulo)}</h2>${s.intro ? `<p>${s.intro}</p>` : ""}
        <div class="par">${reg({ ...s.a, rotulo: s.a.rotulo || "A" })}${reg({ ...s.b, rotulo: s.b.rotulo || "B" })}</div>
        <p><b>${s.pergunta}</b></p>${campoAberto(`${t.id}:contraste:${s.titulo}`, "O que muda?", "")}
        <button class="botao revelar" type="button">Ver o comentário</button><div class="comentario" hidden>${s.comentario}</div></section>`;
    }
  });
  if (t.esboco) h += `<section class="bloco"><div class="rotulo">Volta ao esboço</div><p>Releia o que você escreveu antes da aula. O que mudaria agora?</p>${campoAberto(t.id + ":revisao-esboco", "O que mudaria", "")}</section>`;
  h += `<section class="bloco exercicios" id="${t.id}-ex"><div class="rotulo">Compor</div><h2>Exercícios</h2>
    <p class="lead">Em ordem: completar, com menos apoio, com restrição, livre e uma variante sua. Se o primeiro sair limpo, pule para o livre.</p><ol class="lista-ex">`;
  t.exercicios.forEach((e, k) => {
    const st = est.exercicios[e.id];
    h += `<li><button class="ex-link ${st && st.aprovado ? "feito" : ""}" data-ex="${k}"><span class="n">${k + 1}</span><span class="t"><b>${esc(e.titulo)}</b><small>${esc(e.modo || "")}${st && st.aprovado ? " · aprovado" : st && st.rascunho ? " · em andamento" : ""}</small></span></button></li>`;
  });
  h += `</ol></section><nav class="rodape-tema">${ant ? `<a href="#${ant.id}">← ${esc(ant.titulo)}</a>` : `<a href="#">← Ateliê</a>`}${prox ? `<a href="#${prox.id}">${esc(prox.titulo)} →</a>` : ""}</nav>`;
  $("pagina").innerHTML = h;
  montarExemplos($("pagina"));
  for (const a of document.querySelectorAll(".sumario a")) a.addEventListener("click", () => document.getElementById(a.dataset.alvo)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  for (const ta of document.querySelectorAll("textarea[data-nota]")) ta.addEventListener("input", () => guardarNota(ta.dataset.nota, ta.value));
  for (const b of document.querySelectorAll(".revelar")) b.addEventListener("click", () => { b.nextElementSibling.hidden = false; b.hidden = true; });
  for (const b of document.querySelectorAll(".ex-link")) b.addEventListener("click", () => abrirExercicio(t, t.exercicios[+b.dataset.ex]));
}

// ---------------------------------------------------------------- exercício
let oficina = null;

function perfilDe(e) { return G.perfilDaPratica(e); }

function abrirExercicio(t, e, textoInicial) {
  $("tela-ex").hidden = false;
  document.body.style.overflow = "hidden";
  $("titulo-ex").textContent = e.titulo;
  if (oficina) oficina.destruir();
  const st = est.exercicios[e.id] || {};
  // treino no tom do dia: transpõe o exercício e a solução (as cifras em graus não mudam)
  if (e.tomDoDia && !e._tom) {
    const tom = st.tom || Tr.tomDoDia(e.tomDoDia);
    return abrirExercicio(t, { ...e, _base: e, _tom: tom, titulo: `${e.titulo}: ${nomeTom(tom)}`, texto: Tr.texto(e.texto, tom), solucao: e.solucao && Tr.texto(e.solucao, tom) }, textoInicial);
  }
  const texto = textoInicial || (e._segunda ? e.texto : st.rascunho) || e.texto;
  const caixa = $("oficina");
  // antes do primeiro exercício de cada tema: perguntas obrigatórias sobre o que decidir antes de compor
  if (t.antes && t.antes.length && !(est.antes || {})[t.id]) {
    oficina = null;
    caixa.innerHTML = `<section class="cartao antes-ex"><div class="rotulo">Antes de compor</div>
      <h2>${esc(e.titulo)}</h2><div class="of-instrucoes">${e.instrucoes}</div>
      <p class="lead-p">Responda às perguntas sobre as decisões deste tema. Elas valem para todos os exercícios dele; a partitura abre quando todas estiverem certas.</p>
      <div class="quiz"></div><button class="botao primario grande" id="compor" disabled>Compor</button></section>`;
    montarQuiz(caixa.querySelector(".quiz"), t.antes.map((q) => ({ ...q, certas: [0] })), true, () => { $("compor").disabled = false; });
    $("compor").addEventListener("click", () => { est.antes = { ...(est.antes || {}), [t.id]: true }; salvar(); abrirExercicio(t, e, textoInicial); });
    $("tela-ex").scrollTop = 0;
    return;
  }
  oficina = Of.criar(caixa, {
    titulo: e.titulo, instrucoes: e.instrucoes + acoes(e), texto,
    perfil: perfilDe(e), contexto: G.contextoDaPratica(e),
    cifras: e.cifras, cifrasAluno: e.cifrasAluno, cifrasIniciais: st.cifras != null && !textoInicial && !e._segunda ? st.cifras : e.cifrasIniciais,
    aoErro: registrarErros,
    duracao: e.duracao, alvoCompassos: e.alvoCompassos, fimLivre: e.fimLivre,
    aoMudar: (tx) => { if (!e._segunda) { est.exercicios[e.id] = { ...(est.exercicios[e.id] || {}), rascunho: tx, ...(e._tom ? { tom: e._tom } : {}) }; salvar(); } caixa.querySelector(".depois")?.remove(); },
    aoMudarCifras: (c) => { est.exercicios[e.id] = { ...(est.exercicios[e.id] || {}), cifras: c }; salvar(); caixa.querySelector(".depois")?.remove(); },
    aoAprovar: (tx) => {
      const antes = est.exercicios[e.id] || {};
      if (!antes.aprovado) brinde("Exercício aprovado");
      const hoje = diaDeHoje();
      est.dias = { ...(est.dias || {}), [hoje]: ((est.dias || {})[hoje] || 0) + 1 };
      if (e._segunda) {
        // Schoenberg: a segunda solução só conta se for outra de verdade
        const dif = diferenca(e._segunda, tx);
        if (dif < 0.3) { salvar(); mostrarParecida(dif); return; }
        est.exercicios[e.id] = { ...antes, aprovado: true, segunda: tx };
      } else est.exercicios[e.id] = { ...antes, aprovado: true, rascunho: tx, ...(e._tom ? { tom: e._tom, diaFeito: hoje } : {}) };
      salvar();
      mostrarDepois(t, e, tx, (oficina && oficina.cifras()) || e.cifras || (antes.cifras || e.cifrasIniciais || "").split(/\s+/).filter(Boolean));
    },
  });
  for (const ta of caixa.querySelectorAll("textarea[data-nota]")) ta.addEventListener("input", () => guardarNota(ta.dataset.nota, ta.value));
  ligarAcoes(t, e);
  $("tela-ex").scrollTop = 0;
}

// perguntas de múltipla escolha obrigatórias: só a certa conclui; a errada fica marcada
function montarQuiz(raiz, perguntas, embaralhar, aoConcluir) {
  if (!perguntas.length) { aoConcluir(); return; }
  let feitas = 0;
  perguntas.forEach((q, k) => {
    const ordem = q.o.map((_, i) => i);
    if (embaralhar) for (let i = ordem.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ordem[i], ordem[j]] = [ordem[j], ordem[i]]; }
    const d = document.createElement("div");
    d.className = "questao";
    d.innerHTML = `<p class="q"><span class="num">${k + 1}</span>${bonitoTexto(q.p)}</p><div class="opcoes">${ordem.map((i) => `<button class="opcao" type="button" data-i="${i}">${bonitoTexto(q.o[i])}</button>`).join("")}</div><p class="retorno" hidden></p>`;
    raiz.appendChild(d);
    const ret = d.querySelector(".retorno");
    for (const b of d.querySelectorAll(".opcao")) b.addEventListener("click", () => {
      const certa = q.certas.includes(+b.dataset.i);
      if (!certa) { b.classList.add("errada"); b.disabled = true; ret.hidden = false; ret.className = "retorno nao"; ret.textContent = "Não é essa. Pense de novo" + (embaralhar ? "." : " olhando a partitura."); return; }
      b.classList.add("certa");
      for (const o of d.querySelectorAll(".opcao")) o.disabled = true;
      ret.hidden = false; ret.className = "retorno sim"; ret.innerHTML = "<b>Isso.</b> " + bonitoTexto(q.e);
      d.classList.add("feita");
      if (++feitas === perguntas.length) aoConcluir();
    });
  });
}

function textoSorteado(e) {
  const cf = Cn.sortear();
  if (!cf) return null;
  const cant = "cantus: " + cf.notas.split(" ").map((x, k) => (k ? x : x + "/4")).join(" ");
  let tx = e.texto.replace(/^tom:.*$/m, "tom: " + cf.tom).replace(/^cantus:.*$/m, cant).replace(/^contraponto:.*$/m, "contraponto:");
  if (!/^tom:/m.test(tx)) tx = "tom: " + cf.tom + "\n" + tx;
  return tx;
}

const SOLF = { C: "dó", D: "ré", E: "mi", F: "fá", G: "sol", A: "lá", B: "si" };
const nomeTom = (tom) => { const [n, modo] = tom.split(" "); return SOLF[n[0]] + (n[1] === "b" ? "♭" : n[1] === "#" ? "♯" : "") + " " + modo; };
const diaDeHoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

// regras quebradas em cada correção (para o treino dirigido)
function registrarErros(regras) {
  const hoje = diaDeHoje();
  est.erros = est.erros || {};
  for (const r of regras) est.erros[r] = [...(est.erros[r] || []), hoje].slice(-30);
  salvar();
}

// fração das notas do aluno que mudaram de uma solução para a outra (mesmo instante, outra altura)
function diferenca(tx1, tx2) {
  let a, b;
  try { a = M.lerTexto(tx1); b = M.lerTexto(tx2); } catch (err) { return 1; }
  const nomeCf = (tx2.match(/^cf:\s*(\S+)/m) || [])[1];
  let total = 0, mudou = 0;
  b.vozes.forEach((v, i) => {
    if (v.nome === nomeCf) return;
    const outra = a.vozes.find((x) => x.nome === v.nome);
    for (const n of v.notas) {
      total++;
      const m = outra && outra.notas.find((x) => x.inicio === n.inicio);
      if (!m || m.ps !== n.ps || m.duracao !== n.duracao) mudou++;
    }
  });
  return total ? mudou / total : 0;
}

function mostrarParecida(dif) {
  const caixa = $("oficina");
  caixa.querySelector(".depois")?.remove();
  const s = document.createElement("section");
  s.className = "cartao depois";
  s.innerHTML = `<div class="rotulo">Segunda solução</div><p><b>Correta, mas quase igual à primeira:</b> só ${Math.round(dif * 100)}% das notas mudaram.</p>
    <p class="lead-p">Schoenberg pedia aos alunos outra solução correta e depois outra, até eles enxergarem o princípio que gera todas. Mude uma decisão estrutural — o clímax, o ponto em que a linha cruza o registro, a nota de chegada da cadência intermediária — e não só notas soltas (pelo menos 30% das notas).</p>`;
  caixa.appendChild(s);
  s.scrollIntoView({ behavior: "smooth", block: "start" });
}

function acoes(e) {
  const b = [];
  if (e.sortear) b.push(`<button class="botao" data-acao="sortear">Outro cantus firmus</button>`);
  if (e._tom) b.push(`<button class="botao" data-acao="tom">Outro tom</button>`);
  b.push(`<button class="botao" data-acao="recomecar">Recomeçar</button>`);
  return `<div class="acoes-pratica" style="margin-top:10px">${b.join("")}</div>`;
}

function ligarAcoes(t, e) {
  for (const b of $("oficina").querySelectorAll("[data-acao]")) b.addEventListener("click", () => {
    if (b.dataset.acao === "recomecar") { if (!e._segunda) { est.exercicios[e.id] = { ...(est.exercicios[e.id] || {}), rascunho: null, cifras: null }; salvar(); } abrirExercicio(t, e, e.texto); }
    if (b.dataset.acao === "tom") {
      const lista = e._base.tomDoDia.filter((x) => x !== e._tom);
      const tom = lista[Math.floor(Math.random() * lista.length)];
      est.exercicios[e.id] = { ...(est.exercicios[e.id] || {}), tom, rascunho: null, cifras: null };
      salvar();
      abrirExercicio(t, e._base);
    }
    if (b.dataset.acao === "sortear") {
      const tx = textoSorteado(e);
      if (!tx) return brinde("Tente de novo");
      abrirExercicio(t, { ...e, solucao: null }, tx);
    }
  });
}

// depois da aprovação: relatório de estilo, reflexão e (só então) a versão do professor
function mostrarDepois(t, e, tx, cifras) {
  const caixa = $("oficina");
  caixa.querySelector(".depois")?.remove();
  let ex;
  try { ex = M.lerTexto(tx); } catch (err) { return; }
  const nomeCf = (tx.match(/^cf:\s*(\S+)/m) || [])[1];
  const cf = nomeCf ? ex.vozes.findIndex((v) => v.nome === nomeCf) : -1;
  const itens = Est.relatorio(ex, { cf });
  const prior = [...itens.filter((i) => i.nivel === "atencao"), ...itens.filter((i) => i.nivel === "ok")];
  const perguntas = e._segunda ? [] : Qs.depois(ex, { cf, cifras: cifras && cifras.length ? cifras : null });
  const proximo = proximoExercicio(t, e);
  const s = document.createElement("section");
  s.className = "cartao depois";
  s.innerHTML = (e._segunda ? comparacaoHTML(e._segunda, tx, cf) : `<div class="rotulo">Releia o que você escreveu</div>
    <p class="lead-p">As respostas estão na sua partitura: olhe para ela antes de escolher. A versão do professor aparece quando todas estiverem certas.</p>`) + `
    <div class="quiz"></div>
    <div class="pos-quiz" hidden>
      <details class="relatorio-det"><summary>Relatório de estilo completo</summary>
      <ul class="relatorio">${prior.map((i) => `<li class="${i.nivel}"><b>${esc(i.titulo)}</b><span class="v">${esc(i.valor)}</span><small>Referência: ${esc(i.referencia)}. ${esc(i.nota)}</small></li>`).join("")}</ul></details>
      ${e.solucao || e.sortear ? `<button class="botao" id="ver-prof">Ver a versão do professor</button><div id="prof" hidden></div>` : ""}
      ${e._segunda ? "" : `<button class="botao" id="outra">Desafio: outra solução correta</button><p class="lead-p">Schoenberg pedia uma segunda solução, diferente de verdade, e depois o princípio comum às duas. É o exercício que mais ensina depois de acertar.</p>`}
      ${proximo ? `<button class="botao primario grande" id="proximo">${proximo.rotulo}</button>` : ""}
    </div>`;
  caixa.appendChild(s);
  montarQuiz(s.querySelector(".quiz"), perguntas, false, () => { s.querySelector(".pos-quiz").hidden = false; });
  if (e._segunda) montarExemplos(s);
  $("outra")?.addEventListener("click", () => abrirExercicio(t, { ...e, _segunda: tx, titulo: e.titulo + " · 2ª solução" }, e.texto));
  $("proximo")?.addEventListener("click", () => {
    if (proximo.tema !== t) history.replaceState(null, "", "#" + proximo.tema.id);
    abrirExercicio(proximo.tema, proximo.ex);
  });
  $("ver-prof")?.addEventListener("click", () => {
    const d = $("prof");
    const b = $("ver-prof");
    b.disabled = true; b.textContent = "Procurando uma solução…";
    // exercícios com cantus sorteado: a solução é procurada na hora pelo próprio verificador
    setTimeout(() => {
      const sol = e.solucao || solucaoGerada(e, tx);
      if (!sol) { b.textContent = "Não achei uma solução a tempo"; return; }
      exemplosDaPagina.set("prof", { partitura: sol, cifras: cifrasDaSolucao(sol, e) });
      d.innerHTML = `<p class="rotulo" style="margin-top:12px">Versão do professor</p>${exemploHTML({ rotulo: "" }, "prof")}${e.comentarioSolucao && e.solucao ? `<p>${e.comentarioSolucao}</p>` : e.solucao ? "" : "<p>Solução encontrada agora pelo verificador para o seu cantus firmus: correta, não necessariamente bonita. Compare o contorno e as escolhas de consonância com as suas.</p>"}`;
      d.hidden = false;
      montarExemplos(d);
      b.hidden = true;
    }, 30);
  });
}

// as duas soluções lado a lado, com o que mudou entre elas
function comparacaoHTML(tx1, tx2, cf) {
  const r1 = Est.relatorio(M.lerTexto(tx1), { cf }), r2 = Est.relatorio(M.lerTexto(tx2), { cf });
  exemplosDaPagina.set("sol1", { partitura: tx1 });
  exemplosDaPagina.set("sol2", { partitura: tx2 });
  const linhas = r2.map((i) => { const j = r1.find((x) => x.titulo === i.titulo); return j ? `<tr><td>${esc(i.titulo)}</td><td>${esc(j.valor)}</td><td>${esc(i.valor)}</td></tr>` : ""; }).join("");
  return `<div class="rotulo">Duas soluções corretas</div>
    <div class="par">${exemploHTML({ rotulo: "1ª solução" }, "sol1")}${exemploHTML({ rotulo: "2ª solução" }, "sol2")}</div>
    <table class="tabela-modos"><thead><tr><th></th><th>1ª</th><th>2ª</th></tr></thead><tbody>${linhas}</tbody></table>
    <p class="lead-p">O que ficou igual nas duas é o que o exercício (e o estilo) exige; o que mudou é escolha sua. Ouça as duas: qual decisão estrutural fez a diferença — o clímax, o contorno, as consonâncias perfeitas? Esse é o princípio que Schoenberg pedia.</p>`;
}

// próximo exercício do tema; no último, o primeiro do tema seguinte
function proximoExercicio(t, e) {
  const k = t.exercicios.findIndex((x) => x.id === e.id);
  if (k >= 0 && k < t.exercicios.length - 1) { const ex = t.exercicios[k + 1]; return { tema: t, ex, rotulo: `Próximo: ${ex.titulo} →` }; }
  const idx = temasEmOrdem.findIndex((x) => x.id === t.id);
  const tema = temasEmOrdem[idx + 1];
  return tema ? { tema, ex: tema.exercicios[0], rotulo: `Próximo tema: ${tema.titulo} →` } : null;
}

// cifras da versão do professor, alinhadas às notas do baixo
function cifrasDaSolucao(sol, e) {
  const lista = e.solucaoCifras ? e.solucaoCifras.split(/\s+/) : e.cifras;
  if (!lista) return [];
  let ex;
  try { ex = M.lerTexto(sol); } catch (err) { return []; }
  const baixo = ex.vozes[ex.vozes.length - 1];
  return baixo.notas.map((n, i) => lista[i] && [n.inicio / T, lista[i]]).filter(Boolean);
}

function solucaoGerada(e, tx) {
  const especie = e.perfilNivel === 4 ? 4 : e.duracao >= 4 ? 1 : e.duracao >= 2 ? 2 : 3;
  return Bu.solucao({ texto: tx, especie, perfil: perfilDe(e), ctx: G.contextoDaPratica(e) });
}

$("fechar-ex").addEventListener("click", () => {
  if (oficina) { oficina.destruir(); oficina = null; }
  $("tela-ex").hidden = true;
  document.body.style.overflow = "";
  rota();
});

document.addEventListener("pointerdown", () => { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {} }, { once: true });
// capítulos em módulos (web/livro): carregados em ordem antes de desenhar
function carregarLivro() {
  return (window.LIVRO || []).reduce((p, nome) => p.then(() => new Promise((ok) => {
    const sc = document.createElement("script");
    sc.src = `livro/${nome}.js`;
    sc.onload = ok; sc.onerror = () => { console.error("capítulo não carregou: " + nome); ok(); };
    document.head.appendChild(sc);
  })), Promise.resolve());
}
carregarLivro().then(() => { ordenarTemas(); rota(); });
if (document.fonts) document.fonts.ready.then(() => document.querySelectorAll("figure.exemplo").forEach((f) => f._redesenhar && f._redesenhar()));
